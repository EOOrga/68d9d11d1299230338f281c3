name: bessieres_operations
description: "Local operations workspace for BESSIERES GERALDINE."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - docs/featured.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: docs/icon.png
  min_sdk_android: 23
  adaptive_icon_background: "#001238"
  adaptive_icon_foreground: docs/icon.png
